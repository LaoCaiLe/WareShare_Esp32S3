; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:waveshare_esp32s3_touch_128]
platform = espressif32
; Temporarily use Adafruit board directly to diagnose USB CDC issue.
; The custom board JSON (boards/waveshare_esp32s3_touch_128.json) with
; variant:adafruit_feather_esp32s3 was compiled but USB still failed.
; This tests whether the Adafruit board definition itself still works.
board = adafruit_feather_esp32s3
framework = arduino
upload_speed = 921600
upload_protocol = esptool
; Override: replace UF2 partition table with standard 16MB layout
board_build.partitions = default_16MB.csv
; Override: Adafruit default is 4MB, we have 16MB
board_upload.flash_size = 16MB
build_flags =
    -pipe
lib_deps =
    bblanchon/ArduinoJson @ ^7
extra_scripts = pre:build_cache.py
